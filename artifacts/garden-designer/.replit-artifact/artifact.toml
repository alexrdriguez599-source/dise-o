kind = "web"
previewPath = "/"
title = "Urban AI Garden Designer"
version = "1.0.0"
id = "artifacts/garden-designer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23086

[services.development]
run = "pnpm --filter @workspace/garden-designer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/garden-designer", "run", "build" ]
publicDir = "artifacts/garden-designer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23086"
BASE_PATH = "/"
