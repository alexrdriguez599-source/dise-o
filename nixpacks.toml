# Configuración de despliegue para Railway (servicio único).
# El mismo Express sirve el frontend compilado ('/') y el API ('/api/*').
# No afecta a Replit: Replit no usa este archivo.

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.26.1 --activate",
  "pnpm install --frozen-lockfile --prod=false",
]

[phases.build]
cmds = [
  "PORT=8080 BASE_PATH=/ pnpm --filter @workspace/garden-designer build",
  "pnpm --filter @workspace/api-server build",
]

[start]
cmd = "STATIC_DIR=artifacts/garden-designer/dist/public node --enable-source-maps artifacts/api-server/dist/index.mjs"
